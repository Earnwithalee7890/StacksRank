name: Stacks Ecosystem Multi-Environment Validation
on:
  push:
    branches: [ main, master ]

jobs:
  validate-sdk:
    name: SDK Validation [${{ matrix.os }} | v${{ matrix.node-version }}]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          
      - name: Premium SDK Validation
        # This step pulls from NPM on every unique runner
        run: |
          npm install @earnwithalee/stx-contract@latest --no-package-lock
          
      - name: Premium SDK Validation and Execution
        run: |
          echo "Validating SDK on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
          node -v
          node scripts/stx-client.js
