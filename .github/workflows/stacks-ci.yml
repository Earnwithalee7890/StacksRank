name: Stacks CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Clarinet
        run: |
          wget https://github.com/stx-labs/clarinet/releases/download/v3.16.0/clarinet-linux-x64-glibc.tar.gz
          tar -xf clarinet-linux-x64-glibc.tar.gz
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/

      - name: Check contracts
        run: clarinet check

      - name: Run tests
        run: clarinet test


