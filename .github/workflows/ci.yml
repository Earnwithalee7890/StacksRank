name: Clarity CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Clarinet
        run: |
          wget https://github.com/hirosystems/clarinet/releases/download/v2.10.0/clarinet-linux-x64-glibc.tar.gz
          tar -xvzf clarinet-linux-x64-glibc.tar.gz
          sudo mv clarinet /usr/local/bin/

      - name: Clarinet Check
        run: clarinet check

      - name: Clarinet Test
        run: clarinet test
